# config.yaml


# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
model:
  default_model_id: "deepseek-ai/DeepSeek-V4-Flash"
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.0

# =============================================================================
# GENERAL EXPERIMENT SETTINGS
# =============================================================================
mlflow:
  enabled: true
  log_causal_graphs: true  # render + upload a TP/FP/FN causal graph per document (requires mlflow.enabled)
  # tracking_uri: "mlruns"
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "docicl"

# ── LLM response cache ──
# Prompt-keyed cache over the CoT-synthesis calls. An entry is keyed on the exact serialized
# message list plus the model id and temperature, so a change to any of those is automatically
# a miss. The main inference loop is built with cache=False and is never served from here —
# reported F1 always comes from live calls.
llm_cache:
  enabled: true
  path: "logs/llm_cache.sqlite"
  namespace: ""          # any string; change it to invalidate every existing entry

data:
  labels:                         # uniform label set for all datasets
    - "causes"
    - "causedby"
    - "norel"


experiment:
  concurrency: 50
  retries: 3          # How many times to retry a failed sample
  timeout: 2400       # Seconds before a single inference attempt is cancelled and retried
  resampling:
    enabled: false
    n_runs: 3         # Votes per document
    tie_breaking: "norel"
    distinct_fewshots: false  # true: each resample run gets its own few-shot examples —
                              # selects n_runs * few_shot.n_examples docs and splits them
                              # round-robin across runs (pool must hold at least that many)


# ── Few-shot examples (injected before the user prompt when enabled) ──
few_shot:
  enabled: true
  split: "train"        # split to sample from (a <split>.json in the dataset's data_dir)
  n_examples: 3
  # pool_size: ~          # max training docs to load (null = full split); limits CoT generation cost
  pool_size: 100         # max training docs to load (null = full split); limits CoT generation cost
  selection: "random"
    # "random"     — resample every call for variance
    # "similarity" — TF-IDF cosine against the current doc text (sklearn required)
    # "mentions"   — Jaccard similarity on event mention text sets
    # "smallest"   — Gets the doc with the smallest non negative pair_list (mostly for debuging)
  intra_only: false     # true: only show same-sentence (intra-sentence) gold relations in
                         # few-shot examples — applies everywhere gold is shown to the model
                         # (the CoT-synthesis "correct labels are" hint and the "Output:"
                         # fallback), regardless of cot_generation.enabled. Filtered per
                         # doc["mention_sentence"]. Does not affect which training docs are
                         # selected.
  # data_dir: ~         # optional override; defaults to the active dataset's data_dir
  cot_generation:
    enabled: true      # true: generate realistic CoT few-shots via LLM
    blind: true        # true: generate the reasoning without showing the golds, then revise it
                         # against them (blind -> correct); false (default): one gold-guided pass.
                         # Only applies to single-call prompts (no `steps:` in the active prompt
                         # YAML); multi-step task prompts are always gold-guided.
    rewrite: true       # true (default): a final pass rewrites the response from scratch to strip
                         # phrasing that reveals foreknowledge of the golds (decontamination);
                         # false: keep the gold-guided/corrected response as generated.
                         # blind: false + rewrite: true is the former num_steps: 2 protocol,
                         # blind: true + rewrite: true the former num_steps: 3.
    cache_path: "logs/cot_cache.json"  # persist generated CoTs across runs (~ to disable). Keyed by
                                   # doc id + a fingerprint of the model, prompt and gold-formatting
                                   # config, so entries can never cross experiments.
    dump_dir: "logs/cot_dumps"  # write each synthesized CoT to <dump_dir>/<run>/<doc_id>.txt
                                   # (doc id + doc text + CoT), for manual inspection (~ to disable)

# ── Causal event retrieval (rankers.py) ──
ranking:
  k_max: 10                 # Hit@k, Recall@k and nDCG@k for k = 1..k_max (the printed table needs 10)
  seed: 0                   # seeds the shuffle that orders every ranker's ties
  embedding_model: "all-roberta-large-v1"   # sentence-transformers model of the embedding-cosine ranker
  embedding_device: "cpu"   # "cuda" to encode on a GPU

# =============================================================================
# ACTIVE RUN CONFIGURATION
# =============================================================================
# Set this to the key of the dataset you want to evaluate.
# active_dataset: "maven_ere"
active_dataset: "event_story_line"
# active_dataset: "causal_timebank"

# =============================================================================
# DATASETS
# Definitions of datasets and their specific parameters.
# =============================================================================
datasets:
  maven_ere:
    name: "MAVEN-ERE-Causal"
    data_dir: "data/maven_ere"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    prompt: "maven_ere_standard_eci_intra_lean"
    # Intra- and inter-sentence relations (causal event retrieval):
    # prompt: "maven_ere_standard_eci_lean_coref"   # + group coreferent mentions, link every pair
    kfold:
      enabled: false
      n_folds: -1
    max_examples: 710
    # max_examples: 50
    # max_examples: 5

  causal_timebank:
    name: "CausalTimeBank-standard-eci"
    data_dir: "data/causal_timebank"
    split: "train"
    text_field: "text"
    ann_field: "annots"
    kfold:
      enabled: true
      n_folds: 10
    prompt: "causal_timebank_syntax"
    max_examples: 183

  event_story_line:
    name: "EventStoryLine-0.9"
    data_dir: "data/event_story_line"
    split: "train"
    text_field: "text"
    ann_field: "annots"
    kfold:
      enabled: true
      n_folds: 5
    prompt: "esl_standard_eci_intra_lean"
    # Intra- and inter-sentence relations (causal event retrieval):
    # prompt: "esl_standard_eci_lean_coref"   # + group coreferent mentions, link every pair
    max_examples: 233


